# ==============================================================================
#                                TMUX CONFIG
# ==============================================================================

# Force Alacritty colors and TrueColor support
set -g default-terminal "alacritty"
set -as terminal-features ",alacritty:RGB"

# If running inside VS Code integrated terminal, disable tmux mouse
# so VS Code handles right-click paste. Otherwise enable mouse and
# keep the automatic wl-copy and right-click paste helper.
if-shell '[ -n "${VSCODE_PID:-}" ]' \
	'set -g mouse on; set -s set-clipboard off; unbind -n MouseDown3Pane; unbind-key -T copy-mode-vi MouseDragEnd1Pane; unbind-key -T copy-mode MouseDragEnd1Pane' \
	'set -g mouse on; set -s set-clipboard on; bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"; bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"; bind -n MouseDown3Pane run-shell "/home/alexander/dotfiles/bin/tmux-paste.sh"'

# Graphite selection style (matches Alacritty)
set -g mode-style "fg=#ffffff,bg=#44475a"

# Start numbering from 1 for ergonomic reasons
set -g base-index 1
setw -g pane-base-index 1

# Reduce escape time and paste buffer delay
set -s escape-time 0

